@if (kind() === 'error') {
  <p class="flex min-h-44 items-center justify-center rounded-xl border border-red-900/70 bg-red-950/40 px-6 py-12 text-center text-base leading-7 text-red-200 sm:px-10" role="alert">
    {{ message() }}
  </p>
} @else if (kind() === 'loading') {
  <p class="flex min-h-44 items-center justify-center rounded-xl border border-slate-800 bg-slate-900 px-6 py-12 text-center text-base leading-7 text-slate-200 sm:px-10" role="status">
    {{ message() }}
  </p>
} @else {
  <p class="flex min-h-44 items-center justify-center rounded-xl border border-slate-800 bg-slate-900 px-6 py-12 text-center text-base leading-7 text-slate-200 sm:px-10" role="status">
    {{ message() }}
  </p>
}
